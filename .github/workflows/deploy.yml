name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en el servidor vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/app
            # El servidor siempre queda igual que GitHub (se descartan ediciones hechas a mano allí;
            # cookies.txt y demás archivos no versionados se conservan).
            git fetch origin main
            git reset --hard origin/main

            # Datos persistentes (cuentas, sesiones, archivos) FUERA del contenedor.
            # La imagen guarda en /data: hay que montar ESA ruta o cada deploy lo borra todo.
            DATA=/home/ubuntu/myconversor-data
            mkdir -p "$DATA"
            # Rescate único: copia lo que haya en el contenedor antiguo (volumen anónimo) o en ./.data.
            if [ ! -f "$DATA/db.json" ]; then
              sudo docker cp myconversor-app:/data/. "$DATA/" 2>/dev/null || true
              [ -f "$DATA/db.json" ] || cp -a .data/. "$DATA/" 2>/dev/null || true
            fi

            sudo docker build -t myconversor .

            # Proveedor de PO tokens para YouTube (evita el "Sign in to confirm you're not a bot").
            sudo docker network create myconversor-net 2>/dev/null || true
            if sudo docker pull brainicism/bgutil-ytdlp-pot-provider; then
              sudo docker rm -f bgutil-provider 2>/dev/null || true
              sudo docker run -d --name bgutil-provider --network myconversor-net --restart always --init \
                brainicism/bgutil-ytdlp-pot-provider
            else
              echo "AVISO: no se pudo descargar bgutil-ytdlp-pot-provider; YouTube funcionará sin PO tokens"
            fi

            # Proxy Cloudflare WARP (sin cookies): YouTube ve una IP de Cloudflare en vez de la de Oracle.
            # Se crea una vez y se reutiliza (su registro se guarda en /home/ubuntu/warp-data).
            if ! sudo docker ps --format '{{.Names}}' | grep -qx warp; then
              sudo docker rm -f warp 2>/dev/null || true
              sudo docker run -d --name warp --network myconversor-net --restart always \
                --cap-add MKNOD --cap-add AUDIT_WRITE --cap-add NET_ADMIN \
                --device-cgroup-rule 'c 10:200 rwm' \
                --sysctl net.ipv6.conf.all.disable_ipv6=0 \
                --sysctl net.ipv4.conf.all.src_valid_mark=1 \
                -e WARP_SLEEP=2 \
                -v /home/ubuntu/warp-data:/var/lib/cloudflare-warp \
                caomingjun/warp || true
            fi
            EXTRA=""
            WARP=off
            for i in $(seq 1 36); do   # hasta 3 min: el primer arranque registra WARP
              if sudo docker run --rm --network myconversor-net curlimages/curl -s --max-time 10 \
                   --socks5-hostname warp:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
                WARP=on; break
              fi
              sleep 5
            done
            if [ "$WARP" = on ]; then
              EXTRA="-e MYCONVERSOR_PROXY=socks5h://warp:1080"   # socks5h: el DNS también va por WARP
            else
              echo "AVISO: WARP no responde; yt-dlp saldrá con la IP del servidor (logs: sudo docker logs warp)"
            fi

            # Variables extra opcionales (p. ej. otro MYCONVERSOR_PROXY, que sustituye a WARP).
            if [ -f /home/ubuntu/myconversor.env ]; then
              EXTRA="$EXTRA --env-file /home/ubuntu/myconversor.env"
            fi

            # Parada limpia (SIGTERM) para que la base de datos se guarde antes de borrar el contenedor.
            sudo docker stop -t 20 myconversor-app 2>/dev/null || true
            sudo docker rm myconversor-app 2>/dev/null || true
            sudo docker run -d \
              --name myconversor-app \
              --network myconversor-net \
              --dns 8.8.8.8 \
              --dns 1.1.1.1 \
              -p 8000:8000 \
              --restart always \
              -v "$DATA":/data \
              -e MYCONVERSOR_POT_URL=http://bgutil-provider:4416 \
              $EXTRA \
              myconversor

            sudo docker image prune -f
            sudo systemctl reload caddy || sudo systemctl restart caddy
