# pnpm settings (pnpm 11+ reads them here, not from package.json).
# Only esbuild may run its install script; the rest are optional native speed-ups.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@angular/common@22.2.1'
  - '@angular/compiler-cli@22.2.1'
  - '@angular/compiler@22.2.1'
  - '@angular/core@22.2.1'
  - '@angular/platform-browser@22.2.1'
  - '@angular/platform-server@22.2.1'
  - '@angular/router@22.2.1'
